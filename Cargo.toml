[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
peekexec-core = { path = "crates/peekexec-core", version = "0.0.1" }
peekexec-proto = { path = "crates/peekexec-proto", version = "0.0.1" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
nix = { version = "0.29", features = ["socket", "uio", "user", "signal", "process", "fs"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
proptest = "=1.11"

[profile.release]
# A panic in the root daemon ends the process instead of one thread: no
# client is left waiting on a request whose worker died, and no lock is left
# poisoned. Socket activation starts a fresh daemon on the next connection.
panic = "abort"
