[package]
name = "peekexec-ui"
description = "The peekexec approval dialog"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95" # eframe 0.37

[[bin]]
name = "peekexec-ui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
libc.workspace = true
peekexec-core.workspace = true
peekexec-proto.workspace = true
serde_json.workspace = true
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
