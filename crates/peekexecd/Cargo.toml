[package]
name = "peekexecd"
description = "Root daemon for peekexec: snapshots, prompts, authenticates, runs sandboxed"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Replaces the dialog and PAM with PEEKEXEC_TEST_APPROVER for automated
# tests. Never enabled in release builds; refuses to run as root.
test-approver = []

[dependencies]
clap.workspace = true
libc.workspace = true
nix.workspace = true
peekexec-core.workspace = true
peekexec-proto.workspace = true
serde.workspace = true
similar = "2"
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# polkit over D-Bus (the system prompt on unverified displays)
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
