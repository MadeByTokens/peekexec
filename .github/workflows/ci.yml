name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features peekexecd/test-approver -- -D warnings
      - run: shellcheck packaging/install.sh scripts/*.sh dev/wayland-vm/*.sh
      - name: docs/cli.md is up to date
        run: ./scripts/gen-cli-doc.sh && git diff --exit-code docs/cli.md

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      # Known vulnerabilities, yanked crates, licences, sources (deny.toml).
      - run: cargo deny check
      - run: cargo audit

  test-linux:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --features peekexecd/test-approver

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-targets
      - run: cargo test -p peekexec-core -p peekexec-proto -p peekexec
